<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wortpoker – Einladung</title>
<meta name="description" content="Du wurdest zu Wortpoker-Duellen eingeladen.">
<meta property="og:title" content="👥 Wortpoker – spiel mit mir!">
<meta property="og:description" content="Gleiche Karten für beide – wer schafft mehr Punkte?">
<meta property="og:image" content="https://nurabos95-sudo.github.io/icon.png">
<link rel="icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
  <h1>WORTPOKER</h1>
  <p class="sub" id="sub">Duell</p>
  <div class="card">
    <div class="hero"><img src="../duel.webp" alt=""></div>
    <p class="big" id="who">👥 Du wurdest eingeladen!</p>
    <p class="muted" id="what"></p>
    <a class="btn green" id="open" href="#">▶ In Wortpoker als Freund hinzufügen</a>
    <button class="btn light" id="copy" type="button">📋 Freundescode kopieren</button>
    <a class="btn red" id="store" href="https://play.google.com/store/apps/details?id=de.wortpoker.app">Wortpoker holen (kostenlos)</a>
    <div class="code" id="code"></div>
    <p class="muted" id="how" style="margin-top:12px"></p>
  </div>
  <footer><a href="../">Wortpoker</a><span id="priv" hidden></span></footer>
</main>
<script>
const T = {
  de: { sub: "Freunde", inv: "👥 {0} lädt dich ein!", anon: "👥 Du wurdest eingeladen!", what: "Spielt Wortpoker-Duelle gegeneinander: gleiche Karten für beide – wer schafft mehr Punkte?",
    open: "▶ In Wortpoker als Freund hinzufügen", copy: "📋 Freundescode kopieren", copied: "✓ Kopiert", store: "Wortpoker holen (kostenlos)",
    how: "Geht die App nicht auf? Wortpoker öffnen → ⚔️ Duell → ➕ Freund hinzufügen → Code einfügen.", old: "Duell-Codes gibt es nicht mehr. Öffne Wortpoker und füge deine Freunde unter ⚔️ Duell hinzu.", bad: "Dieser Link ist ungültig.", priv: "Datenschutz" },
  en: { sub: "Friends", inv: "👥 {0} invites you!", anon: "👥 You've been invited!", what: "Play Wordpoker duels against each other: same cards for both – who scores more?",
    open: "▶ Add as friend in Wordpoker", copy: "📋 Copy friend code", copied: "✓ Copied", store: "Get Wordpoker (free)",
    how: "App doesn't open? Open Wordpoker → ⚔️ Duel → ➕ Add friend → paste the code.", old: "Duel codes no longer exist. Open Wordpoker and add your friends under ⚔️ Duel.", bad: "This link is not valid.", priv: "Privacy" },
  es: { sub: "Amigos", inv: "👥 ¡{0} te invita!", anon: "👥 ¡Te han invitado!", what: "Jugad duelos de Wordpoker: las mismas cartas para los dos – ¿quién hace más puntos?",
    open: "▶ Añadir como amigo en Wordpoker", copy: "📋 Copiar código de amigo", copied: "✓ Copiado", store: "Descargar Wordpoker (gratis)",
    how: "¿No se abre la app? Abre Wordpoker → ⚔️ Duelo → ➕ Añadir amigo → pega el código.", old: "Los códigos de duelo ya no existen. Abre Wordpoker y añade a tus amigos en ⚔️ Duelo.", bad: "Este enlace no es válido.", priv: "Privacidad" },
  fr: { sub: "Amis", inv: "👥 {0} t'invite !", anon: "👥 Tu as été invité !", what: "Jouez des duels Wordpoker : les mêmes cartes pour les deux – qui marquera le plus ?",
    open: "▶ Ajouter en ami dans Wordpoker", copy: "📋 Copier le code ami", copied: "✓ Copié", store: "Télécharger Wordpoker (gratuit)",
    how: "L'appli ne s'ouvre pas ? Ouvre Wordpoker → ⚔️ Duel → ➕ Ajouter un ami → colle le code.", old: "Les codes de duel n'existent plus. Ouvre Wordpoker et ajoute tes amis dans ⚔️ Duel.", bad: "Ce lien n'est pas valide.", priv: "Confidentialité" },
  pt: { sub: "Amigos", inv: "👥 {0} te convidou!", anon: "👥 Você foi convidado!", what: "Joguem duelos de Wordpoker: as mesmas cartas para os dois – quem faz mais pontos?",
    open: "▶ Adicionar como amigo no Wordpoker", copy: "📋 Copiar código de amigo", copied: "✓ Copiado", store: "Baixar Wordpoker (grátis)",
    how: "O app não abre? Abra o Wordpoker → ⚔️ Duelo → ➕ Adicionar amigo → cole o código.", old: "Os códigos de duelo não existem mais. Abra o Wordpoker e adicione seus amigos em ⚔️ Duelo.", bad: "Este link não é válido.", priv: "Privacidade" },
};
const L = T[(navigator.language || "de").slice(0, 2)] || T.en;
const f = (s, a) => s.replace(/\{(\d)\}/g, (_, i) => a[i]);
const $ = (id) => document.getElementById(id);
// Einladung eines Freundes: #F-<öffentliche ID>~<Name>~<4 Ziffern>
const h = decodeURIComponent(location.hash || location.search || "");
const m = /F-([0-9a-z]{4,16})(?:~([^~]*)~(\d{4})?)?/i.exec(h);
$("sub").textContent = L.sub; $("copy").textContent = L.copy; $("store").textContent = L.store; $("how").textContent = L.how; $("priv").textContent = L.priv;
document.documentElement.lang = (navigator.language || "de").slice(0, 2);
if (!m) {
  $("who").textContent = /WP-/i.test(h) ? L.old : L.bad; $("open").style.display = "none"; $("copy").style.display = "none"; $("how").style.display = "none";
} else {
  const pub = m[1], name = (m[2] || "").slice(0, 14), code = name && m[3] ? name + "#" + m[3] : "";
  $("who").textContent = name ? f(L.inv, [name]) : L.anon;
  $("what").textContent = L.what;
  $("code").textContent = code;
  $("open").textContent = L.open;
  const isAndroid = /Android/i.test(navigator.userAgent);
  const store = "https://play.google.com/store/apps/details?id=de.wortpoker.app";
  $("open").href = isAndroid
    ? `intent://duel?f=${pub}#Intent;scheme=wortpoker;package=de.wortpoker.app;S.browser_fallback_url=${encodeURIComponent(store)};end`
    : `wortpoker://duel?f=${pub}`;
  if (!code) $("copy").style.display = "none";
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(code); } catch (e) {
      const r = document.createRange(); r.selectNodeContents($("code")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
    $("copy").textContent = L.copied; setTimeout(() => ($("copy").textContent = L.copy), 1800);
  };
}
</script>
</body>
</html>
